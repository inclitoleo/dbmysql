name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: pdo, pdo_mysql
          coverage: none
      - name: PHP syntax lint
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

  tests:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: dbmysql_test
          MYSQL_USER: dbmysql
          MYSQL_PASSWORD: dbmysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: dbmysql_test
      MYSQL_USER: dbmysql
      MYSQL_PASSWORD: dbmysql
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql
          coverage: pcov
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Load test schema
        run: mysql -h 127.0.0.1 -P 3306 -udbmysql -pdbmysql dbmysql_test < tests/fixtures/init.sql
      - name: Unit tests
        run: vendor/bin/phpunit --testsuite=unit
      - name: Integration tests
        run: vendor/bin/phpunit --testsuite=integration
      - name: Security tests
        run: vendor/bin/phpunit --testsuite=security
      - name: Regression tests
        run: vendor/bin/phpunit --testsuite=regression
      - name: Coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
      - name: Enforce v3 coverage >= 90%
        run: php scripts/check-v3-coverage.php coverage.xml
