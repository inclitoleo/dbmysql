services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: dbmysql_lab
      MYSQL_USER: dbmysql
      MYSQL_PASSWORD: dbmysql
    ports:
      - "3311:3306"
    volumes:
      - ./tests/fixtures/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptest"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: sandbox/Dockerfile
    ports:
      - "8088:8080"
    volumes:
      - .:/package:ro
      - ./sandbox:/app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: dbmysql_lab
      MYSQL_USER: dbmysql
      MYSQL_PASSWORD: dbmysql
